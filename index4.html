<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLaptop - Create New Account</title>
    <!-- ربط ملف التنسيقات الخارجي -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- ربط مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="">
</head>
<body>
    
    <!-- شريط التنقل العلوي -->
    
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-laptop"></i> TechLaptop
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index1.html" >Products</a>
            <a href="index4.html" class="active">Register</a>
            <a href="index2.html" >Login</a>
            <a href="index3.html">Contact Us</a>
        </nav>
    </header>

    <!-- الحاوية الرئيسية للصفحة -->
    <main class="main-content">
        <!-- صندوق نموذج تسجيل الدخول -->
        <div class="login-container">
            <div class="login-header">
                <!-- أيقونة العنوان -->
                <i class="fas fa-sign-in-alt"></i>
                <h2>Create New Account</h2>
            </div>
            
            <form id="Register-form">
                <div class="form-group">
                        <label for="fullname" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                
                <button type="submit" class="login-btn">Register</button>
            </form>
            
        </div>
    </main>

    <!-- ربط ملف الجافا سكريبت الخارجي -->
    <script src="../js/script.js"></script>
</body>
</html>
